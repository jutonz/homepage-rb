schemaVersion: "2"
kind: mixin
name: homepage-rb
version: "1.0.0"
displayName: homepage-rb
description: >-
  Ruby, Node, PostgreSQL with pgvector, Playwright, and a self-healing
  dependency install for the homepage-rb application.

permissions:
  network:
    allow:
      # Playwright's browser CDN. Denied by the default policy, and on the
      # critical path to a green system-spec run.
      - cdn.playwright.dev
      # Bundler's compact index. Denied by the default policy, which sends
      # Bundler to the full RubyGems index instead and costs tens of minutes.
      - index.rubygems.org
      # The Linear API, for the linear CLI installed by install-system.
      - api.linear.app

environment:
  variables:
    DEBIAN_FRONTEND: noninteractive
    BINDING: 0.0.0.0
    PLAYWRIGHT_BROWSERS_PATH: /usr/local/share/ms-playwright
    # mise keeps a trust database outside the config file, and a template
    # does not carry it. A sandbox from a template then finds the global
    # config that install-toolchain wrote, refuses it, and fails every
    # command that reaches a mise shim. install-system reaches one when it
    # runs node, so the sandbox never provisions.
    MISE_TRUSTED_CONFIG_PATHS: /home/agent/.config/mise
    SOURCE_DIR: /run/sandbox/source

setup:
  install:
    - command: bash /home/agent/.sbx-kit/install-system
      user: "0"
      description: >-
        Install system packages, PostgreSQL, pgvector, Playwright, and the
        linear CLI
    - command: bash /home/agent/.sbx-kit/install-toolchain
      user: "1000"
      description: Install the Ruby and Node versions the repository pins

  startup:
    - command: ["bash", "/home/agent/.sbx-kit/enable-toolchain-path"]
      user: "0"
      description: Put the mise shims on PATH for every shell
    # Early, so that an agent the developer attaches to has their skills and
    # instructions within seconds rather than after the dependency install.
    - command: ["bash", "/home/agent/.sbx-kit/push-agent-config"]
      user: "1000"
      description: Copy the developer's own agent configuration into the sandbox
    - command: ["bash", "/home/agent/.sbx-kit/start-postgres"]
      user: "0"
      description: Start PostgreSQL
    - command: ["bash", "/home/agent/.sbx-kit/prepare-checkout"]
      user: "1000"
      description: Write keys, install dependencies, prepare databases
    # Again last, because an agent image can rewrite its own configuration
    # after the step above and the kit must have the final say. The script
    # is repeatable and skips the one expensive copy on this second run.
    - command: ["bash", "/home/agent/.sbx-kit/push-agent-config"]
      user: "1000"
      description: Re-apply the developer's own agent configuration
